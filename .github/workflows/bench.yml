name: Benchmarks

# Every push to main records the numbers; every pull request is compared against its base on
# the same runner, by wall-clock runs that take turns and by instruction counts; a weekly run and
# manual runs measure larger corpora on every platform.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "benches/**"
      - "examples/**"
      - "Cargo.toml"
      - "scripts/criterion-*"
      - "scripts/instructions-compare.py"
      - ".github/workflows/bench.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      records:
        description: "Records in the synthetic corpus"
        default: "2000000"
      iterations:
        description: "Iterations per workload"
        default: "7"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workloads:
    name: Workloads (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      - name: Machine
        shell: bash
        run: |
          echo "### ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          (nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "$NUMBER_OF_PROCESSORS") | sed 's/^/cores: /' >> "$GITHUB_STEP_SUMMARY"

      - name: Run the workloads
        shell: bash
        run: |
          ./scripts/bench.sh \
            --records "${{ github.event.inputs.records || '1000000' }}" \
            --iterations "${{ github.event.inputs.iterations || '5' }}" \
            --output bench-results

      - name: Summary
        shell: bash
        run: cat bench-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: workloads-${{ matrix.os }}
          path: bench-results

  criterion:
    name: Criterion (${{ github.event_name == 'pull_request' && 'head vs base' || 'record' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      # The cache restores target/, and with it what an earlier run left of target/criterion:
      # baseline directories whose measurements the cache cleaned out, which every benchmark
      # then fails to compare against. Each run starts from none.
      - name: Start from no measurements
        run: rm -rf target/criterion target/criterion-ab

      # The base revision and this one take turns (base, head, head, base), so that both see
      # the same machine; a benchmark changed only if its runs say so beyond their own spread.
      - name: Compare with the base revision, runs alternating
        if: github.event_name == 'pull_request'
        env:
          NTFS_NG_BENCH_RECORDS: "100000"
        run: |
          ./scripts/criterion-ab.sh "${{ github.event.pull_request.base.sha }}" \
            --warm-up-time 1 --measurement-time 3 > criterion-ab.md \
            || echo "::notice::the base revision has no comparable benchmarks"
          tee -a "$GITHUB_STEP_SUMMARY" < criterion-ab.md

      - name: Record this revision
        if: github.event_name != 'pull_request'
        env:
          NTFS_NG_BENCH_RECORDS: "100000"
        run: cargo bench --all-features -- --noplot

      - name: Upload Criterion reports
        uses: actions/upload-artifact@v7
        with:
          name: criterion
          path: |
            target/criterion
            target/criterion-ab
          if-no-files-found: ignore

  # The parsers' instruction counts under Valgrind (benches/instructions.rs): exact whatever the
  # runner's load or the code's alignment, so that parsers a change did not touch count the same.
  instructions:
    name: Instructions (${{ github.event_name == 'pull_request' && 'head vs base' || 'record' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Valgrind, and gungraun's runner at the dev-dependency's version
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          version="$(cargo metadata --format-version 1 --locked | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "gungraun"))')"
          cargo install --locked gungraun-runner --version "$version"

      # As target/criterion above: no counts of an earlier run, which a run compares with.
      - name: Start from no counts
        run: rm -rf target/gungraun

      - name: Count the base revision
        if: github.event_name == 'pull_request'
        run: |
          git checkout --quiet "${{ github.event.pull_request.base.sha }}"
          cargo bench --all-features --bench instructions -- --save-baseline=base --nosummary \
            || echo "::notice::the base revision has no instruction benchmarks"
          git checkout --quiet "${{ github.sha }}"

      - name: Count this revision
        run: |
          baseline=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then baseline=(--baseline=base); fi
          cargo bench --all-features --bench instructions -- "${baseline[@]}" --output-format=json \
            > instructions.jsonl

      - name: Compare
        run: python3 scripts/instructions-compare.py instructions.jsonl --threshold 1 | tee -a "$GITHUB_STEP_SUMMARY"
